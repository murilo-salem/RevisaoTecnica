services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - revisao_net

  app:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3:27b}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-600}
      OUTPUT_DIR: /app/output
    volumes:
      - ./output:/app/output
      - ./benchmarks:/app/benchmarks:ro
    networks:
      - revisao_net

volumes:
  ollama_models:

networks:
  revisao_net:
    driver: bridge
